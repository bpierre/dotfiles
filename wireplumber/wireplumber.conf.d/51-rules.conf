monitor.alsa.rules = [
  {
    matches = [{ node.name = "~alsa_output.pci-0000_c3_00.6.*" }],
    actions = {
      update-props = {
        node.nick = "Z13 Speakers",
        priority.session = 1000,
      },
    },
  },
  {
    matches = [{ node.name = "~alsa_output.usb-R__DE_Microphones.*" }],
    actions = {
      update-props = {
        priority.session = 10,
      },
    },
  },
  {
    matches = [{ node.name = "~alsa_input.usb-R__DE_Microphones.*" }],
    actions = {
      update-props = {
        node.nick = "RODE NT-USB Mini",
        priority.session = 3000,
        priority.driver = 3000,
      },
    },
  },
  {
    matches = [{ node.name = "~alsa_input.pci-0000_c3_00.6.HiFi__Mic.*" }],
    actions = {
      update-props = {
        priority.session = 2000,
        priority.driver = 2000,
      },
    },
  },
]

monitor.bluez.rules = [
  {
    matches = [{ node.name = "~bluez_output.*" }],
    actions = {
      update-props = {
        priority.session = 1010,
      },
    },
  },
]
